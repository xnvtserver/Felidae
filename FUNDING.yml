## Funding Felidae

Felidae is developed as open-source infrastructure, and funding helps turn community support into measurable engineering work.

Support is used for:

* **Development** — language features, compiler/runtime improvements, and tooling
* **Stabilization** — bug fixes, reliability improvements, and compatibility work
* **Documentation** — guides, examples, API references, and learning materials
* **Testing** — test coverage, regression testing, and CI infrastructure
* **Packaging** — releases, distribution, and installation tooling
* **Ecosystem work** — integrations, developer tools, and community infrastructure

If Felidae is useful to you or your organization, you can help fund its continued development through the project's funding options.

**Support Felidae development, stabilization, documentation, testing, packaging and ecosystem work.**

