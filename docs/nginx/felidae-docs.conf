# Nginx reverse proxy for the Felidae documentation SPA.
#
# Runtime process:
#   cd /opt/felidae/Felidae
#   ./build/felidae docs/server.fx
#
# The Felidae server should stay bound to 127.0.0.1:8090. Nginx owns the
# public socket, TLS, compression, and normal HTTP proxy headers.

upstream felidae_docs_backend {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;

    access_log /var/log/nginx/felidae-docs.access.log;
    error_log /var/log/nginx/felidae-docs.error.log warn;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_pass http://felidae_docs_backend;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://felidae_docs_backend/;
    }
}

