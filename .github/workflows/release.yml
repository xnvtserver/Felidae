name: Felidae Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release is never cancelled by a later tag; each tag is its own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: felidae-linux-x86_64
            executable: build/release/felidae
            packaged: build/felidae-linux-x86_64
          - os: windows-2025
            artifact: felidae-windows-x86_64
            executable: build/release/Release/felidae.exe
            packaged: build/felidae-windows-x86_64.exe
          - os: macos-15
            artifact: felidae-macos-arm64
            executable: build/release/felidae
            packaged: build/felidae-macos-arm64
          - os: macos-15-intel
            artifact: felidae-macos-x86_64
            executable: build/release/felidae
            packaged: build/felidae-macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dependencies
      - name: Cache compiler output
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-${{ matrix.os }}
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build/release
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DFELIDAE_BUILD_TESTS=ON
          -DFELIDAE_ENABLE_STRICT_WARNINGS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/release
          -DCMAKE_BUILD_TYPE=Release
          -DFELIDAE_DEPENDENCY_JOBS=4
          -DFELIDAE_BUILD_TESTS=ON
          -DFELIDAE_ENABLE_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build/release --config Release
      - name: Test
        run: ctest --test-dir build/release --build-config Release --output-on-failure
      - name: Smoke executable
        run: ${{ matrix.executable }} --version
      - name: Stage executable
        run: cmake -E copy ${{ matrix.executable }} ${{ matrix.packaged }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packaged }}
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: felidae-*
          path: release-files
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-files
        run: sha256sum felidae-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-files/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
