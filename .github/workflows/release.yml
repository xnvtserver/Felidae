name: Felidae Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: felidae-linux-x86_64
            executable: build/release/felidae
            packaged: build/felidae-linux-x86_64
          - os: windows-2025
            artifact: felidae-windows-x86_64
            executable: build/release/Release/felidae.exe
            packaged: build/felidae-windows-x86_64.exe
          - os: macos-15
            artifact: felidae-macos-arm64
            executable: build/release/felidae
            packaged: build/felidae-macos-arm64
          - os: macos-15-intel
            artifact: felidae-macos-x86_64
            executable: build/release/felidae
            packaged: build/felidae-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >-
          cmake -S . -B build/release
          -DCMAKE_BUILD_TYPE=Release
          -DFELIDAE_BUILD_TESTS=ON
          -DFELIDAE_ENABLE_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build/release --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/release --build-config Release --output-on-failure
      - name: Smoke executable
        run: ${{ matrix.executable }} --version
      - name: Stage executable
        run: cmake -E copy ${{ matrix.executable }} ${{ matrix.packaged }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.packaged }}
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: felidae-*
          path: release-files
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-files
        run: sha256sum felidae-* > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-files/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
