sonar.projectKey=felidae_lang
sonar.projectName=Felidae
sonar.sourceEncoding=UTF-8

# The scanner container generates this database at the same Linux path it
# scans, so CFamily analysis can resolve every compiler invocation reliably.
sonar.cfamily.compile-commands=build/sonar/compile_commands.json

sonar.sources=src,native_modules
sonar.exclusions=build/**,third_party/**,docs/**,examples/**,v2_examples/**,**/node_modules/**,**/build/**
sonar.coverage.exclusions=src/main.cpp,src/celidae/main.cpp,src/debugger/main.cpp
sonar.qualitygate.wait=true
